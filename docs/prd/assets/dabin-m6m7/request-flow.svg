<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">M6 요청 처리 흐름</title>
  <desc id="desc">클라이언트 연결은 연결 큐를 거쳐 작업 스레드로 전달된다. 경로 규칙이 없으면 정적 파일 또는 CGI로 응답한다. 규칙이 있으면 Round-Robin으로 백엔드를 고른다. 중계 준비에 실패하면 502 또는 504를 응답하고, 최종 응답 전송 중 실패하면 연결을 닫는다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#66778c"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #18263a; }
    .label { font-size: 23px; font-weight: 700; }
    .detail { font-size: 19px; fill: #43556c; }
    .code { font-family: Consolas, monospace; font-size: 21px; font-weight: 700; }
    .arrow { fill: none; stroke: #66778c; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="650" rx="22" fill="#f8fafc"/>

  <g text-anchor="middle">
    <rect x="36" y="36" width="244" height="90" rx="16" fill="#e8f0ff" stroke="#abc5fa" stroke-width="2"/>
    <text x="158" y="73" class="label">클라이언트</text>
    <text x="158" y="102" class="detail">서버에 연결</text>

    <rect x="378" y="36" width="244" height="90" rx="16" fill="#e8f0ff" stroke="#abc5fa" stroke-width="2"/>
    <text x="500" y="73" class="label">연결 큐</text>
    <text x="500" y="102" class="detail">서버가 수락한 연결 대기</text>

    <rect x="720" y="36" width="244" height="90" rx="16" fill="#e8f0ff" stroke="#abc5fa" stroke-width="2"/>
    <text x="842" y="73" class="label">작업 스레드</text>
    <text x="842" y="102" class="detail">요청 읽기 및 검사</text>

    <rect x="310" y="170" width="380" height="76" rx="15" fill="#fff" stroke="#abc5fa" stroke-width="2"/>
    <text x="500" y="203" class="label">경로 규칙 찾기</text>
    <text x="500" y="229" class="detail">일치하는 가장 긴 접두사 선택</text>
  </g>
  <path class="arrow" d="M281 81 H375"/>
  <path class="arrow" d="M623 81 H717"/>
  <path class="arrow" d="M842 127 V147 H500 V167"/>
  <path class="arrow" d="M500 247 V272 H168 V307"/>
  <path class="arrow" d="M500 247 V272 H654 V307"/>
  <text x="208" y="295" class="detail">일치하는 규칙 없음</text>
  <text x="673" y="295" class="detail">일치하는 규칙 있음</text>

  <rect x="36" y="310" width="264" height="124" rx="16" fill="#fff" stroke="#c8d3e0" stroke-width="2"/>
  <text x="168" y="359" text-anchor="middle" class="label">정적 파일 · CGI</text>
  <text x="168" y="391" text-anchor="middle" class="detail">서버가 직접 응답</text>

  <rect x="344" y="310" width="620" height="313" rx="18" fill="#fff" stroke="#b6ccc9" stroke-width="2"/>
  <text x="370" y="350" class="label">Round-Robin으로 첫 백엔드 선택</text>
  <rect x="772" y="324" width="170" height="34" rx="9" fill="#eef3f8"/>
  <text x="857" y="347" text-anchor="middle" class="detail">8001 · 8002</text>

  <rect x="366" y="368" width="386" height="78" rx="12" fill="#e8f0ff" stroke="#abc5fa" stroke-width="2"/>
  <text x="383" y="398" class="code" style="fill:#255bb0">proxy_open</text>
  <text x="383" y="426" class="detail">연결 → 요청 전송 → 응답 헤더 검사</text>
  <path d="M753 407 H771" stroke="#b64646" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="772" y="368" width="170" height="78" rx="12" fill="#fff0ef" stroke="#e8a6a2" stroke-width="2"/>
  <text x="857" y="398" text-anchor="middle" class="detail">준비 실패</text>
  <text x="857" y="426" text-anchor="middle" class="label" style="fill:#a23131">502 / 504</text>

  <rect x="366" y="461" width="576" height="47" rx="11" fill="#fff1d9" stroke="#e5bd77" stroke-width="2"/>
  <text x="654" y="491" text-anchor="middle" class="label" style="fill:#8b520e">클라이언트에게 최종 응답 전송 시작</text>

  <rect x="366" y="523" width="386" height="77" rx="12" fill="#e4f5f1" stroke="#9bcfc3" stroke-width="2"/>
  <text x="383" y="553" class="code" style="fill:#086f60">proxy_relay</text>
  <text x="383" y="581" class="detail">응답 헤더와 본문을 전달</text>
  <path d="M753 562 H771" stroke="#b64646" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="772" y="523" width="170" height="77" rx="12" fill="#fff0ef" stroke="#e8a6a2" stroke-width="2"/>
  <text x="857" y="553" text-anchor="middle" class="detail">전송 중 실패</text>
  <text x="857" y="581" text-anchor="middle" class="label" style="fill:#a23131">연결 종료</text>
</svg>
